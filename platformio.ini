[platformio]
default_envs = robot_a

[env]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200

lib_deps =
    links2004/WebSockets@^2.7.3
    bblanchon/ArduinoJson@^7.2.2

[env:robot_a]
build_flags =
    -D ROBOT_ID=1

[env:robot_b]
build_flags =
    -D ROBOT_ID=2